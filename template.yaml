AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless online store. DynamoDB (data), Lambda (logic), API Gateway (front door),
  Cognito (login), S3 + CloudFront (website). Deploying this one file creates everything.

# ---------------------------------------------------------------------------
# Parameters: the only settings you may want to change.
# ---------------------------------------------------------------------------
Parameters:
  AppName:
    Type: String
    Default: eshop
    AllowedPattern: "^[a-z][a-z0-9-]{2,20}$"
    Description: A short lowercase name. Used to name tables, functions and the login pool. Keep "eshop" unless you know why.
  SenderEmail:
    Type: String
    Default: ""
    Description: Optional. An email address you have verified in Amazon SES. When set, order confirmation emails are sent from it.

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    CodeUri: backend/src/
    Environment:
      Variables:
        PRODUCTS_TABLE: !Ref ProductsTable
        ORDERS_TABLE: !Ref OrdersTable
        SENDER_EMAIL: !Ref SenderEmail

Resources:
  # -------------------------------------------------------------------------
  # 1. DATABASE (DynamoDB). Pay-per-request, so you pay nothing when nobody shops.
  # -------------------------------------------------------------------------
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AppName}-products"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: productId
          KeyType: HASH

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AppName}-orders"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: orderId
          KeyType: RANGE

  # -------------------------------------------------------------------------
  # 2. LOGIN (Cognito). Shoppers sign up with email + password and confirm with a code.
  # -------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AppName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AppName}-website"
      GenerateSecret: false # a website cannot keep a secret, so there is none
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days

  # Members of this group can use the admin page. You add yourself in Step 8.
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      Description: Store administrators
      UserPoolId: !Ref UserPool

  # -------------------------------------------------------------------------
  # 3. FRONT DOOR (API Gateway, HTTP API). Checks the login token, then calls a function.
  # -------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # The website runs on a different address than the API, so the browser needs
      # permission (CORS) to call it. Login tokens travel in a header, not cookies,
      # so allowing any website origin does not let other sites act as a shopper.
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: [content-type, authorization]
        AllowMethods: [GET, POST, PUT, OPTIONS]
        MaxAge: 600
      # A safety brake so a bug or an attacker cannot run up your bill.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient

  # -------------------------------------------------------------------------
  # 4. FUNCTIONS (Lambda). One small function per job.
  # -------------------------------------------------------------------------
  ListProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-list-products"
      Handler: products.list
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProductsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /products
            Method: GET

  GetProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-get-product"
      Handler: products.get
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProductsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /products/{id}
            Method: GET

  PlaceOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-place-order"
      Handler: orders.place
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /orders
            Method: POST
            Auth:
              Authorizer: CognitoJwt

  ListOrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-list-orders"
      Handler: orders.list
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /orders
            Method: GET
            Auth:
              Authorizer: CognitoJwt

  AdminAddProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-admin-add-product"
      Handler: admin.addProduct
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/products
            Method: POST
            Auth:
              Authorizer: CognitoJwt

  AdminUpdateProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-admin-update-product"
      Handler: admin.updateProduct
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/products/{id}
            Method: PUT
            Auth:
              Authorizer: CognitoJwt

  AdminListProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-admin-list-products"
      Handler: admin.listAllProducts
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProductsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/products
            Method: GET
            Auth:
              Authorizer: CognitoJwt

  AdminListOrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-admin-list-orders"
      Handler: admin.listOrders
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/orders
            Method: GET
            Auth:
              Authorizer: CognitoJwt

  # -------------------------------------------------------------------------
  # 5. WEBSITE HOSTING (S3 + CloudFront). The bucket stays private; only CloudFront can read it.
  # -------------------------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AppName} website"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200 # includes India, cheaper than "all locations"
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS "CachingOptimized"
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # AWS "SecurityHeadersPolicy"
        # The shop is one page that changes by address (/cart, /orders ...).
        # When someone opens or refreshes such an address, send them the main page.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontToRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

# ---------------------------------------------------------------------------
# Outputs: the addresses and ids the website and scripts need.
# ---------------------------------------------------------------------------
Outputs:
  ApiUrl:
    Description: Address of the backend API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  UserPoolId:
    Description: Login pool id
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Login client id used by the website
    Value: !Ref UserPoolClient
  SiteBucketName:
    Description: Bucket that holds the website files
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution id
    Value: !Ref SiteDistribution
  SiteUrl:
    Description: Your live website address
    Value: !Sub "https://${SiteDistribution.DomainName}"
  Region:
    Description: AWS Region everything lives in
    Value: !Ref AWS::Region
