<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="AWS Serverless Online Store">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="150" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="1130" cy="290" r="110" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="90" cy="300" r="90" fill="#ffffff" fill-opacity="0.06"/>
  <!-- little shop icon, drawn with shapes so it looks the same everywhere -->
  <g transform="translate(70 70)">
    <rect x="0" y="52" width="150" height="100" rx="8" fill="#ffffff"/>
    <path d="M-10 52 L10 4 H140 L160 52 Z" fill="#fbbf24"/>
    <path d="M-10 52 H20 V68 a15 15 0 0 1 -30 0 Z" fill="#f59e0b"/>
    <path d="M20 52 H50 V68 a15 15 0 0 1 -30 0 Z" fill="#fde68a"/>
    <path d="M50 52 H80 V68 a15 15 0 0 1 -30 0 Z" fill="#f59e0b"/>
    <path d="M80 52 H110 V68 a15 15 0 0 1 -30 0 Z" fill="#fde68a"/>
    <path d="M110 52 H140 V68 a15 15 0 0 1 -30 0 Z" fill="#f59e0b"/>
    <path d="M140 52 H160 V68 a15 15 0 0 1 -20 0 Z" fill="#fde68a"/>
    <rect x="18" y="92" width="48" height="60" rx="4" fill="#4f46e5"/>
    <rect x="84" y="92" width="48" height="36" rx="4" fill="#bfdbfe"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="270" y="130" font-size="58" font-weight="800">AWS Serverless</text>
    <text x="270" y="198" font-size="58" font-weight="800">Online Store</text>
    <text x="272" y="244" font-size="24" fill-opacity="0.92">A real shop that lives in the cloud, with no servers to look after.</text>
  </g>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff">
    <g transform="translate(272 266)">
      <rect width="62" height="30" rx="15" fill="#ffffff" fill-opacity="0.18"/><text x="31" y="21" text-anchor="middle">S3</text>
      <g transform="translate(72 0)"><rect width="110" height="30" rx="15" fill="#ffffff" fill-opacity="0.18"/><text x="55" y="21" text-anchor="middle">CloudFront</text></g>
      <g transform="translate(192 0)"><rect width="92" height="30" rx="15" fill="#ffffff" fill-opacity="0.18"/><text x="46" y="21" text-anchor="middle">Cognito</text></g>
      <g transform="translate(294 0)"><rect width="140" height="30" rx="15" fill="#ffffff" fill-opacity="0.18"/><text x="70" y="21" text-anchor="middle">API Gateway</text></g>
      <g transform="translate(444 0)"><rect width="86" height="30" rx="15" fill="#ffffff" fill-opacity="0.18"/><text x="43" y="21" text-anchor="middle">Lambda</text></g>
      <g transform="translate(540 0)"><rect width="110" height="30" rx="15" fill="#ffffff" fill-opacity="0.18"/><text x="55" y="21" text-anchor="middle">DynamoDB</text></g>
    </g>
  </g>
</svg>
